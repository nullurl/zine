<main>

  </button>

    <button class="swatch" type="button" style="--swatch:#217A5B" data-color="#217A5B" aria-label="绿色" aria-pressed="false"></button>
    <button class="swatch" type="button" style="--swatch:#6A45A5" data-color="#6A45A5" aria-label="紫色" aria-pressed="false"></button>

      <input id="customColor" type="color" value="#2E429B" aria-label="自定义颜色">
    </label>
    <button id="desktopMode" class="desktop-mode" type="button" aria-label="切换为放到桌面" aria-pressed="false" title="放到桌面">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.1" y="2.6" width="11.8" height="8.1" rx="1.5"></rect><path d="M6 13.4h4M8 10.9v2.5"></path></svg>
    </button>
  </div>
</div>
<div id="galleryGuide" class="gallery-guide" role="status" hidden>

  <button id="galleryGuideClose" type="button">知道了</button>
</div>
<div id="statusToast" class="status-toast" role="status" hidden></div>
<div id="desktopGuide" class="desktop-guide" role="dialog" aria-modal="true" aria-labelledby="desktopGuideTitle" hidden>
  <section class="desktop-guide-card">
    <p class="desktop-guide-kicker">macOS 可选功能</p>
    <h2 id="desktopGuideTitle">启用桌面贴纸</h2>
    <p>需要运行 StickerDesk 小助手，普通 PNG 和 SVG 下载不受影响。</p>
    <p class="browser-note">如果当前页面位于 Codex 内置浏览器，请使用 Safari 打开后再放到桌面。</p>
    <div class="desktop-guide-actions">
      <button id="desktopGuideCancel" class="secondary" type="button">暂时不用</button>
      <button id="desktopGuideReady" class="primary" type="button">我已打开 StickerDesk</button>
    </div>
  </section>
</div>
<section class="paper">__CARDS__</section>
</main>
